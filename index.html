<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKQ WATCHES</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background-color: #0f0f0f;
            color: #fff;
            margin: 0; padding: 0;
            font-family: 'Arial', sans-serif;
        }

        /* تنسيق الهيدر واللوجو */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #050505;
        }
        .logo-text { font-size: 22px; font-weight: bold; color: white; }
        .logo-img { height: 40px; width: auto; object-fit: contain; }

        /* 1. فيديو الخلفية الاحترافي */
        .hero {
            position: relative;
            overflow: hidden;
            min-height: 65vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #111;
        }
        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 0;
            object-fit: cover;
            pointer-events: none;
        }
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
        }

        /* 2. تنسيق عنوان EXCLUSIVE COLLECTION */
        .section-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 50px auto 30px auto;
            padding-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            width: fit-content;
        }

        /* 3. تأثير الزجاج الضبابي للكروت */
        .watches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product-card {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 20px !important;
            padding: 15px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
        }
        .product-card img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        /* 4. الزرار الفضي الزجاجي */
        .whatsapp-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.4) !important;
            color: #ffffff !important;
            padding: 12px !important;
            border-radius: 12px !important;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-text">AKQ WATCHES</div>
        <img src="assets/images/logo.png" alt="AKQ Watches" class="logo-img" onerror="this.style.display='none'">
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <video autoplay loop muted playsinline class="hero-video">
            <source src="assets/videos/video.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <h1 style="color: white; font-size: 32px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px;">TIMELESS STYLE.<br>YOUR CHOICE.</h1>
            <div class="hero-buttons">
                <a href="#collection" style="display: inline-block; padding: 12px 25px; border: 1px solid rgba(255,255,255,0.5); color: white; text-decoration: none; border-radius: 30px; font-weight: bold; margin: 5px; backdrop-filter: blur(5px); background: rgba(255,255,255,0.1);">EXPLORE</a>
                <a href="https://wa.me/201141091027" target="_blank" style="display: inline-block; padding: 12px 25px; background: rgba(255,255,255,0.9); color: black; text-decoration: none; border-radius: 30px; font-weight: bold; margin: 5px;">WHATSAPP</a>
            </div>
        </div>
    </section>

    <!-- Collection Section -->
    <section id="collection" class="collection-section">
        <h2 class="section-title">EXCLUSIVE COLLECTION</h2>
        
        <div id="watches-container" class="watches-grid">
            <!-- الكروت هتتولد هنا أوتوماتيك -->
        </div>
    </section>

    <footer style="text-align: center; padding: 20px; background: #050505; color: #666; margin-top: 30px;">
        <p>&copy; 2026 AKQ WATCHES. All rights reserved.</p>
    </footer>

    <!-- سكربت الساعات الذكي (يقرأ من الفولدر ومن الصفحة الرئيسية معاً) -->
    <script>
        const totalWatches = 194; 
        const container = document.getElementById('watches-container');
        let watchesHTML = '';
        
        for(let i = 1; i <= totalWatches; i++) {
            watchesHTML += `
            <div class="product-card">
                <img src="assets/images/watch${i}.jpg" alt="Model ${i}" loading="lazy" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='watch${i}.jpg';}else{this.parentElement.style.display='none';}">
                <a href="https://wa.me/201141091027?text=Hello,%20AKQ,%20price%20for%20Model%20${i}" class="btn whatsapp-btn" target="_blank">ASK PRICE</a>
            </div>
            `;
        }
        
        container.innerHTML = watchesHTML;
    </script>

</body>
</html>
